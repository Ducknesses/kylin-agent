# ============================================================
# Nginx 配置 — Kylin Agent 控制节点
# ============================================================
# 安装方法:
#   cp deploy/backend/nginx-kylin-agent.conf /etc/nginx/sites-available/kylin-agent
#   ln -s /etc/nginx/sites-available/kylin-agent /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ============================================================

upstream kylin_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 请求体大小限制
    client_max_body_size 10m;

    # ── 前端静态文件 ──────────────────────────────────
    root /opt/kylin-agent/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API 反向代理 ──────────────────────────────────
    location /api/ {
        proxy_pass http://kylin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── WebSocket 升级 ────────────────────────────────
    location /ws {
        proxy_pass http://kylin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── 健康检查直通 ──────────────────────────────────
    location /health {
        proxy_pass http://kylin_backend;
        proxy_set_header Host $host;
    }
}