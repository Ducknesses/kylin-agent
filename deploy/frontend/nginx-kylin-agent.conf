# ============================================================
# Nginx 配置 — Kylin Agent 控制节点（HTTPS/WSS）
# ============================================================
# 
# 部署时自动生成自签名证书（生产环境请替换为正式证书）。
#
# 安装方法:
#   cp deploy/frontend/nginx-kylin-agent.conf /etc/nginx/sites-available/kylin-agent
#   ln -s /etc/nginx/sites-available/kylin-agent /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ============================================================

upstream kylin_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS 强制跳转 ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 供 acme 验证使用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS / WSS 入口 ──────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # 证书路径（部署时自动生成或手动替换）
    ssl_certificate     /etc/nginx/certs/kylin-agent.crt;
    ssl_certificate_key /etc/nginx/certs/kylin-agent.key;

    # TLS 安全策略
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 请求体大小限制
    client_max_body_size 10m;

    # ── 前端静态文件 ──────────────────────────────────────
    root /opt/kylin-agent/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── SSE 实时流（监控大盘）— 必须关闭代理缓冲，否则数据被阻塞 ──
    location /api/monitor/stream {
        proxy_pass http://kylin_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ── API 反向代理 ──────────────────────────────────────
    location /api/ {
        proxy_pass http://kylin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket / WSS 升级 ──────────────────────────────
    location /ws/ {
        proxy_pass http://kylin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 健康检查 ──────────────────────────────────────────
    location /health {
        proxy_pass http://kylin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}