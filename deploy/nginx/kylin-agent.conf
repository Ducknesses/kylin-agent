# =============================================================================
# 麒麟智能运维 Agent — Nginx HTTPS/WSS 反向代理配置
# =============================================================================
# 用途：作为 TLS 终止层，将 HTTPS/WSS 请求反向代理到后端 FastAPI（HTTP/WS）。
#
# 使用方式：
#   1. 将本文件复制到 /etc/nginx/sites-available/kylin-agent
#   2. 创建软链接：ln -s /etc/nginx/sites-available/kylin-agent /etc/nginx/sites-enabled/
#   3. 将 SSL 证书放入 deploy/nginx/certs/ 目录（或你指定的路径）
#   4. 测试并重载：nginx -t && nginx -s reload
# =============================================================================

# ---------------------------------------------------------------------------
# 上游 FastAPI 服务（本机 HTTP，不对外暴露）
# ---------------------------------------------------------------------------
upstream kylin_agent_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS 强制跳转
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 供 Let's Encrypt / acme 验证使用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS / WSS 入口
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name _;

    # ── 证书 ──────────────────────────────────────────────────────────
    # 生产环境请替换为真实证书路径（禁止将真实证书提交到 Git）
    ssl_certificate     /etc/nginx/certs/kylin-agent.crt;
    ssl_certificate_key /etc/nginx/certs/kylin-agent.key;

    # ── TLS 安全策略（Mozilla Intermediate） ───────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── 安全头 ────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ── 日志 ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/kylin-agent.access.log;
    error_log  /var/log/nginx/kylin-agent.error.log;

    # ── 请求体限制 ────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── REST API 代理 ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://kylin_agent_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket / WSS 代理 ──────────────────────────────────────────
    # 匹配 /ws/chat/{session_id} 等 WebSocket 路径
    location /ws/ {
        proxy_pass http://kylin_agent_backend;
        proxy_http_version 1.1;

        # WebSocket 升级必须头
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 健康检查代理 ──────────────────────────────────────────────────
    location /health {
        proxy_pass http://kylin_agent_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 默认拒绝（不暴露其他路径） ─────────────────────────────────────
    location / {
        return 403;
    }
}
