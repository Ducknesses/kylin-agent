# =============================================================================
# Kylin Agent — WSL 测试环境 Nginx 配置（用户态，无需 sudo）
# =============================================================================
# 
# 监听非特权端口:
#   8080 → HTTPS 跳转
#   8443 → HTTPS/WSS + 前端静态文件 + API 反向代理
#
# 启动: nginx -c /opt/kylin-agent/deploy/nginx/kylin-agent-wsl.conf
# 停止: nginx -c /opt/kylin-agent/deploy/nginx/kylin-agent-wsl.conf -s quit
# 重载: nginx -c /opt/kylin-agent/deploy/nginx/kylin-agent-wsl.conf -s reload
#
# 注意：以下路径使用 /opt/kylin-agent 标准部署路径，
#       如果项目位于其他位置，请替换所有 /opt/kylin-agent 为实际项目路径。
# =============================================================================

# 以当前用户运行（无需 root）
# PID 放到 /tmp，避免权限问题
pid /tmp/kylin-agent-nginx.pid;

# 单 worker 足够测试
worker_processes 1;
error_log /tmp/kylin-agent-nginx-error.log warn;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 日志写到 /tmp（用户可写）
    access_log /tmp/kylin-agent-nginx-access.log;
    error_log  /tmp/kylin-agent-nginx-error.log;

    # ── 上游后端 ──────────────────────────────────────────────────────
    upstream kylin_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS 跳转 ─────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # ── HTTPS / WSS 入口 ──────────────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /opt/kylin-agent/deploy/nginx/certs/kylin-agent.crt;
        ssl_certificate_key /opt/kylin-agent/deploy/nginx/certs/kylin-agent.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # 安全头（测试环境不设 HSTS）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        client_max_body_size 10m;

        # ── 前端静态文件 ──────────────────────────────────────────────
        root /opt/kylin-agent/frontend/dist;
        index index.html;

        # ── SSE 实时流（监控大盘）— 必须关闭代理缓冲，否则数据被阻塞 ──
        location /api/monitor/stream {
            proxy_pass http://kylin_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding on;
        }

        # ── API 代理 ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://kylin_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # ── WebSocket / WSS 代理 ──────────────────────────────────────
        location /ws/ {
            proxy_pass http://kylin_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── 前端 SPA fallback ─────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}