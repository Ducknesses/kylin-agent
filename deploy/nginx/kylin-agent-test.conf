# =============================================================================
# Kylin Agent — WSL 测试环境 Nginx 配置（HTTPS/WSS + 前端静态文件）
# =============================================================================
# 
# 与生产配置的区别：
#   - 引用 deploy/nginx/certs/ 下自动生成的自签名证书
#   - 同时提供前端静态文件服务和后端 API/WSS 反向代理
#
# 部署方式：
#   1. sudo cp deploy/nginx/kylin-agent-test.conf /etc/nginx/sites-available/kylin-agent-test
#   2. sudo ln -sf /etc/nginx/sites-available/kylin-agent-test /etc/nginx/sites-enabled/kylin-agent-test
#   3. sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream kylin_agent_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS 强制跳转
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS / WSS 入口
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name _;

    # ── 证书（自签名测试证书） ──────────────────────────────────────────
    ssl_certificate     /home/jackb/projects/kylin-agent/deploy/nginx/certs/kylin-agent.crt;
    ssl_certificate_key /home/jackb/projects/kylin-agent/deploy/nginx/certs/kylin-agent.key;

    # ── TLS 安全策略 ────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全头（测试环境跳过 HSTS，避免浏览器永久记住） ────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ── 请求体限制 ───────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── 前端静态文件 ─────────────────────────────────────────────────────
    # （与 deploy/frontend/nginx-kylin-agent.conf 保持一致）
    root /opt/kylin-agent/frontend/dist;
    index index.html;

    # ── REST API 代理 ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://kylin_agent_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket / WSS 代理 ─────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://kylin_agent_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 健康检查代理 ─────────────────────────────────────────────────────
    location /health {
        proxy_pass http://kylin_agent_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 前端 SPA fallback ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}